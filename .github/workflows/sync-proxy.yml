name: Proxy Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Download, filter and format proxies
        run: |
          > raw_combined.txt
          
          curl -sL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt" >> raw_combined.txt
          echo "" >> raw_combined.txt
          
          grep -v -i -E "Anycast-IP|fixnet|fixcord|cloudflare|warp|cf-" raw_combined.txt > filtered.txt
          
          sort -u filtered.txt | grep -E -v "^$" > proxy.txt
          
          rm -f raw_combined.txt filtered.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add proxy.txt
          git commit -m "auto-update clean proxies" || echo "Nothing to commit"
          git push origin HEAD:${{ github.ref_name }}