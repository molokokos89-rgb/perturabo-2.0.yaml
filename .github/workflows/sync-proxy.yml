name: Proxy Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Install Sing-box Compiler
        run: |
          sudo bash -c "$(curl -fsSL https://sing-box.app)"
          sudo apt-get install sing-box -y

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Collect Raw Proxies
        run: |
          python collector.py

      - name: Filter and generate clean proxy list
        run: |
          python checker.py
          rm -f raw_combined.txt proxy_test.txt checker_test.py

      - name: Compile Unified Rulesets to SRS
        run: |
          sing-box rule-set compile blocked.json --output My_rules_BLOCKED.srs
          sing-box rule-set compile allowed.json --output My_rules_ALLOWED.srs

           - name: Install Sing-box Compiler
        run: |
          curl -Lo sing-box.tar.gz https://github.com
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-1.11.0-alpha.5-linux-amd64/sing-box /usr/local/bin/
          rm -rf sing-box.tar.gz sing-box-1.11.0-alpha.5-linux-amd64
