name: Auto Update Reject Rules

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'reject_rules.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Sing-box Compiler
        run: |
          SING_BOX_VERSION="1.10.1"
          curl -sSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
          rm -rf sing-box.tar.gz "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Run Build Script
        run: python build.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reject_rules.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update reject_rules.json [skip ci]"
            git push
          fi