name: Auto Update Reject Rules

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sing-box Compiler
        run: |
          curl -Lo sing-box.tar.gz https://github.com
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-1.11.0-alpha.5-linux-amd64/sing-box /usr/local/bin/
          rm -rf sing-box.tar.gz sing-box-1.11.0-alpha.5-linux-amd64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python build.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reject_rules.json
          git diff-index --quiet HEAD || git commit -m "Auto-update reject_rules.json"
          git push

