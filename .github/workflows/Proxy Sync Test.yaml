name: Proxy Sync Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Collect Raw Proxies
        run: |
          python collector.py

      - name: Filter and generate test proxy list
        run: |
          python checker_test.py
          rm -f raw_combined.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add proxy_test.txt
          git commit -m "test update proxy_test.txt" || echo "Nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
