port: 0
socks-port: 0
redir-port: 0
tproxy-port: 0
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: error
ipv6: false
global-client-fingerprint: chrome
keep-alive-idle: 30
keep-alive-interval: 30

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 77.88.8.8
    - 8.8.8.8
    - https://dns.yandex.ru/dns-query
    - https://1.1.1.1/dns-query
  fake-ip-filter:
    - '*.githubusercontent.com'
    - '*.github.com'
    - 'github.com'
    - '*.gstatic.com'
    - 'gstatic.com'
    - '*.nalog.ru'
    - '*.nalog.gov.ru'
    - '*.boosty.to'
    - '*.max.ru'
    - '*.bitrix24.ru'
    - '*.bitrix24.net'
    - '*.bitrix24.com'
    - '*.b24.ru'
    - '*.gosuslugi.ru'
    - '*.pgu.mos.ru'
    - '*.rostelecom.ru'
    - '*.rt.ru'
    - '*.edu.ru'
    - '*.vk.com'
    - '*.vk.ru'
    - '*.vk.me'
    - '*.vk.net'
    - '*.vk.org'
    - '*.vk-cdn.net'
    - '*.yandex.ru'
    - '*.yandex.net'
    - '*.yandex.com'
    - '*.yandex.org'
    - '*.dzen.ru'
    - '*.yoomoney.ru'
    - '*.mail.ru'
    - '*.ok.ru'
    - '*.ru'
    - '*.su'
    - '*.xn--p1ai'
    - '*.by'
    - '*.org.ru'
    - '*.net.ru'
    - '*.pp.ru'
    - '*.pool.ntp.org'
    - '*.ntp.org'

proxy-providers:
  vless-sub-1:
    type: http
    url: https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt
    interval: 3600
    path: ./vless_sub_1.yaml
    health-check:
      enable: true
      url: http://gstatic.com
      interval: 600
  vless-sub-2:
    type: http
    url: https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/8a0ea60f714033c3ff85ab67f08d944fe2fe0776/BLACK_VLESS_RUS.txt
    interval: 7200
    path: ./vless_sub_2.yaml
    health-check:
      enable: true
      url: http://gstatic.com
      interval: 1200
  vless-sub-3:
    type: http
    url: https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt
    interval: 7200
    path: ./vless_sub_2.yaml
    health-check:
      enable: true
      url: http://gstatic.com
      interval: 1200

proxy-groups:
  - name: VLESS-Auto
    type: url-test
    url: http://gstatic.com
    interval: 300
    tolerance: 300
    lazy: false
    use:
      - vless-sub-1
      - vless-sub-2
      - vless-sub-3

rule-providers:
  my-direct-rules:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/molokokos89-rgb/perturabo-2.0.yaml/refs/heads/main/my_rules.json
    path: ./rules/my_rules.yaml
    interval: 14400

