port: 0
socks-port: 0
redir-port: 0
tproxy-port: 0
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: error
ipv6: false
global-client-fingerprint: chrome
keep-alive-idle: 30
keep-alive-interval: 30
tcp-concurrent: true

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  direct-nameserver:
    - system
  nameserver:
    - 9.9.9.9
    - 8.8.8.8
    - tls://9.9.9.9
    - tls://8.8.8.8
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
  fake-ip-filter:
    - '*.githubusercontent.com'
    - '*.github.com'
    - 'github.com'
    - '*.gstatic.com'
    - 'gstatic.com'
    - '*launches-appsflyersdk.com'
    - '*launches-appsflyer.com'
    - '*appsflyersdk.com'
    - '*appsflyer.com'
    - '*.nalog.ru'
    - '*.nalog.gov.ru'
    - '*.boosty.to'
    - '*.max.ru'
    - '*.bitrix24.ru'
    - '*.bitrix24.net'
    - '*.bitrix24.com'
    - '*.b24.ru'
    - '*.gosuslugi.ru'
    - '*.pgu.mos.ru'
    - '*.rostelecom.ru'
    - '*.rt.ru'
    - '*.edu.ru'
    - '*.vk.com'
    - '*.vk.ru'
    - '*.vk.me'
    - '*.vk.net'
    - '*.vk.org'
    - '*.vk-cdn.net'
    - '*.yandex.ru'
    - '*.yandex.net'
    - '*.yandex.com'
    - '*.yandex.org'
    - '*.dzen.ru'
    - '*.yoomoney.ru'
    - '*.mail.ru'
    - '*.ok.ru'
    - '*.ru'
    - '*.su'
    - '*.xn--p1ai'
    - '*.by'
    - '*.org.ru'
    - '*.net.ru'
    - '*.pp.ru'
    - '*.pool.ntp.org'
    - '*.ntp.org'

proxy-providers:
  vless-sub-1:
    type: http
    url: "https://cdn.jsdelivr.net/gh/igareck/vpn-configs-for-russia@main/BLACK_SS%2BAll_RUS.txt"
    interval: 3600
    path: ./vless_sub_1.yaml
    health-check:
      enable: false
      url: http://gstatic.com
      interval: 600
      timeout: 800

  vless-sub-2:
    type: http
    url: "https://cdn.jsdelivr.net/gh/igareck/vpn-configs-for-russia@8a0ea60f714033c3ff85ab67f08d944fe2fe0776/BLACK_VLESS_RUS.txt"
    interval: 7200
    path: ./vless_sub_2.yaml
    health-check:
      enable: true
      url: http://gstatic.com
      interval: 600
      timeout: 800

  vless-sub-3:
    type: http
    url: "https://cdn.jsdelivr.net/gh/igareck/vpn-configs-for-russia@main/BLACK_VLESS_RUS.txt"
    interval: 7200
    path: ./vless_sub_3.yaml
    health-check:
      enable: true
      url: http://gstatic.com
      interval: 600
      timeout: 800

proxy-groups:
  - name: VLESS-Auto
    type: fallback
    url: http://gstatic.com
    interval: 120
    timeout: 500
    lazy: false
    use:
      - vless-sub-1
      - vless-sub-2
      - vless-sub-3

rule-providers:
  my-proxy-rules:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/molokokos89-rgb/perturabo-2.0.yaml@main/my_rules_proxy.json"
    path: ./rules/proxy.json
    interval: 600

  my-direct-rules:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/molokokos89-rgb/perturabo-2.0.yaml@main/My_rules_RUS.json"
    path: ./rules/direct.json
    interval: 600

rules:
  - DOMAIN-SUFFIX,adriver.ru,REJECT
  - DOMAIN-SUFFIX,doubleclick.net,REJECT
  - RULE-SET,my-proxy-rules,VLESS-Auto
  - RULE-SET,my-direct-rules,DIRECT
  - MATCH,VLESS-Auto
